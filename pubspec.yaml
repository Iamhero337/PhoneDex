name: phonedex
description: "PhoneDex - Transform your Android into a desktop experience with wireless-first reliability"
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.2
  json_annotation: ^4.9.0
  path: ^1.9.0
  collection: ^1.18.0
  logging: ^1.2.0
  equatable: ^2.0.5
  win32: ^5.5.1
  ffi: ^2.1.2
  web_socket_channel: ^2.4.5
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  window_manager: ^0.3.8
  bitsdojo_window: ^0.1.6
  system_tray: ^2.0.2
  device_info_plus: ^10.1.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/